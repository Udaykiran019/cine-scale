<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115 115" width="100%" height="100%">
  <defs>
    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Film Reel / Clapper Badge with Hard Shadow -->
  <g filter="url(#shadow)">
    <!-- Base Badge -->
    <rect x="15" y="15" width="85" height="85" rx="16" fill="#FACC15" stroke="#000000" stroke-width="4"/>
    
    <!-- Cinema Clapper Stripes -->
    <path d="M 22 25 L 35 25 L 26 40 L 15 40 Z" fill="#000000"/>
    <path d="M 45 25 L 58 25 L 49 40 L 36 40 Z" fill="#000000"/>
    <path d="M 68 25 L 81 25 L 72 40 L 59 40 Z" fill="#000000"/>
    <path d="M 91 25 L 98 25 L 95 30 L 95 40 L 82 40 Z" fill="#000000"/>
    <line x1="15" y1="40" x2="100" y2="40" stroke="#000000" stroke-width="4"/>

    <!-- Up Arrow (Higher) -->
    <polygon points="40,75 58,52 76,75 66,75 66,90 50,90 50,75" fill="#000000"/>
  </g>
</svg>
